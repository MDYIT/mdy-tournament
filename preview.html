<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDY Preseason Basketball Tournament</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#12151C; --board-2:#1B2029;
    --ink:#15181E; --paper:#ECEEF0; --card:#FFFFFF;
    --amber:#F7A31E; --amber-soft:#FFE0A6;
    --red:#D93A42; --navy:#1C2C4C; --green:#2E9E5B;
    --steel:#6A7480; --steel-2:#98A2AD; --line:#DCE0E5;
    --shadow:0 1px 0 rgba(21,24,30,.04), 0 6px 18px rgba(21,24,30,.06);
    --board-fg:#F4F6F8;
    --sans:"Barlow",system-ui,-apple-system,sans-serif;
    --cond:"Barlow Condensed",system-ui,sans-serif;
    --semi:"Barlow Semi Condensed",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0E1116; --card:#171B22; --ink:#EAECEF; --line:#2A3038;
      --steel:#9AA4AF; --steel-2:#6C7681; --board:#090B0F; --board-2:#141821;
      --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0E1116; --card:#171B22; --ink:#EAECEF; --line:#2A3038;
    --steel:#9AA4AF; --steel-2:#6C7681; --board:#090B0F; --board-2:#141821;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans); color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased; line-height:1.5}
  a{color:inherit}
  button{font-family:inherit}
  h1,h2,h3{margin:0; font-family:var(--cond); font-weight:700; letter-spacing:.01em; line-height:1.02}

  /* ---------- Scoreboard hero ---------- */
  .board{background:var(--board); color:var(--board-fg); position:relative; overflow:hidden}
  .board::before{content:""; position:absolute; inset:0;
    background:
      radial-gradient(120% 80% at 8% -10%, rgba(247,163,30,.16), transparent 55%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 2px, transparent 2px 6px);
    pointer-events:none}
  .board-inner{max-width:1080px; margin:0 auto; padding:26px 20px 18px; position:relative}
  .emblem{margin-bottom:16px}
  .emblem .chip{background:#fff; border-radius:14px; padding:9px 13px; display:inline-flex; box-shadow:0 6px 18px rgba(0,0,0,.3)}
  .emblem img{height:62px; width:auto; display:block}
  @media (max-width:560px){ .emblem img{height:52px} }
  .teamstrip{display:flex; gap:8px; margin-top:16px; overflow-x:auto; padding-bottom:4px; scrollbar-width:thin}
  .teamstrip::-webkit-scrollbar{height:6px}
  .teamstrip::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22); border-radius:3px}
  .lchip{background:#fff; border:0; border-radius:9px; padding:5px 7px; height:42px; display:inline-flex; align-items:center; flex:none; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.28); transition:transform .12s}
  .lchip:hover{transform:translateY(-2px)}
  .lchip:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
  .lchip img{height:100%; width:auto; display:block; max-width:74px; object-fit:contain}
  .kicker{font-family:var(--cond); font-weight:600; text-transform:uppercase; letter-spacing:.18em;
    font-size:13px; color:var(--amber); margin-bottom:6px; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .kicker .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber)}
  .board h1{font-size:clamp(36px,6.4vw,66px); text-transform:uppercase; letter-spacing:.005em; color:#fff; line-height:.94; max-width:16ch}
  .memorial{font-family:var(--semi); font-weight:600; color:var(--amber-soft); font-size:15.5px; margin-top:12px; display:flex; align-items:center; gap:10px; letter-spacing:.01em}
  .memorial::before{content:""; width:20px; height:1px; background:var(--amber); flex:none}
  .board-meta{margin-top:14px; display:flex; gap:22px; flex-wrap:wrap; font-family:var(--semi); font-weight:600; color:#C6CCD4; font-size:15px}
  .board-meta span{display:inline-flex; align-items:center; gap:7px}
  .board-meta svg{width:15px;height:15px;stroke:var(--amber);fill:none;stroke-width:2}

  /* ticker */
  .ticker{border-top:1px solid rgba(255,255,255,.08); border-bottom:1px solid rgba(255,255,255,.08); background:var(--board-2); overflow:hidden; position:relative}
  .ticker-track{display:inline-flex; gap:0; white-space:nowrap; padding:9px 0; animation:crawl 46s linear infinite; will-change:transform}
  .ticker:hover .ticker-track{animation-play-state:paused}
  @keyframes crawl{from{transform:translateX(0)} to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion: reduce){ .ticker-track{animation:none; padding-left:20px} }
  .tk{display:inline-flex; align-items:baseline; gap:9px; padding:0 20px; border-right:1px solid rgba(255,255,255,.08); font-family:var(--semi); font-size:14.5px; color:#D6DBE2}
  .tk b{font-weight:700; color:#fff}
  .tk .sc{font-family:var(--cond); font-weight:700; font-size:17px; color:#fff; letter-spacing:.02em}
  .tk .live{color:var(--red); font-weight:700; font-family:var(--cond); letter-spacing:.06em}
  .tk .live::before{content:"●"; font-size:9px; margin-right:4px; vertical-align:1px}
  .tk .up{color:var(--amber)}
  .tk .win{color:var(--amber)}
  .tk-label{align-self:center; color:#231603; background:var(--amber); font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.09em; border-right:0; border-radius:999px; padding:3px 15px; margin:0 8px; font-size:14px}

  /* ---------- Nav ---------- */
  .nav{position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter:saturate(1.4) blur(8px); border-bottom:1px solid var(--line)}
  .nav-inner{max-width:1080px; margin:0 auto; padding:0 12px; display:flex; align-items:center; gap:2px; overflow-x:auto}
  .tab{appearance:none; border:0; background:transparent; color:var(--steel); font-family:var(--cond); font-weight:600; font-size:18px; text-transform:uppercase; letter-spacing:.04em; padding:15px 16px 12px; cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--amber)}
  .tab:focus-visible{outline:2px solid var(--amber); outline-offset:-2px; border-radius:4px}
  .edit-flag{margin-left:auto; display:none; align-items:center; gap:7px; padding:5px 11px; margin-right:4px; font-family:var(--semi); font-weight:600; font-size:12.5px; color:var(--navy); background:var(--amber-soft); border-radius:999px; white-space:nowrap}
  body[data-edit="1"] .edit-flag{display:inline-flex}
  .edit-flag svg{width:13px;height:13px;stroke:var(--navy);fill:none;stroke-width:2}

  /* ---------- Layout ---------- */
  main{max-width:1080px; margin:0 auto; padding:26px 20px 80px}
  .panel{display:none}
  .panel.active{display:block; animation:fade .25s ease}
  @keyframes fade{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
  .sec-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 16px}
  .sec-head h2{font-size:clamp(24px,4vw,32px); text-transform:uppercase; color:var(--ink)}
  .round-label{font-family:var(--cond); font-weight:600; text-transform:uppercase; letter-spacing:.1em; font-size:14px; color:var(--steel); margin:26px 0 12px; display:flex; align-items:center; gap:12px}
  .round-label::after{content:""; flex:1; height:1px; background:var(--line)}

  /* badges (team wordmark / logo) */
  .badge{display:inline-flex; align-items:center; justify-content:center; padding:0 9px; height:34px; min-width:34px; border-radius:8px; font-family:var(--cond); font-weight:700; font-size:16px; letter-spacing:.02em; color:#fff; background:var(--navy); flex:none; line-height:1; text-shadow:0 1px 1px rgba(0,0,0,.18); overflow:hidden}
  .badge.has-logo{background:#fff; padding:3px}
  .badge.has-logo img{height:100%; width:auto; object-fit:contain; display:block; max-width:78px}
  .badge.sm{height:28px; min-width:28px; font-size:13px; padding:0 7px; border-radius:7px}
  .badge.sm.has-logo{padding:3px}
  .badge.sm.has-logo img{max-width:46px}
  .badge.lg{height:60px; min-width:60px; font-size:22px; padding:0 12px; border-radius:12px}
  .badge.lg.has-logo{padding:5px}
  .badge.lg.has-logo img{max-width:100px}

  /* buttons */
  .btn{appearance:none; border:1px solid var(--line); background:var(--card); color:var(--ink); font-family:var(--semi); font-weight:600; font-size:14px; padding:9px 15px; border-radius:9px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; transition:border-color .15s, background .15s; text-decoration:none}
  .btn:hover{border-color:var(--steel-2)}
  .btn:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
  .btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
  .btn-primary{background:var(--amber); border-color:var(--amber); color:#231603}
  .btn-primary:hover{background:#ffb43e; border-color:#ffb43e}
  .btn-ghost{border-color:transparent; background:transparent; color:var(--steel); padding:7px 10px}
  .btn-ghost:hover{color:var(--ink); background:color-mix(in srgb, var(--ink) 6%, transparent)}
  .btn-sm{padding:5px 10px; font-size:13px; border-radius:7px}
  .edit-only{display:none}
  body[data-edit="1"] .edit-only{display:inline-flex}
  body[data-edit="1"] .edit-only.block{display:block}

  /* ---------- Game cards ---------- */
  .games{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:14px}
  .game{background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden}
  .game-top{display:flex; align-items:center; justify-content:space-between; padding:9px 14px; background:var(--board); color:#C8CED6; font-family:var(--semi); font-weight:600; font-size:12.5px; letter-spacing:.03em}
  .game-top .status{font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.08em}
  .status.final{color:var(--steel-2)}
  .status.live{color:#ff6067}
  .status.up{color:var(--amber)}
  .team-row{display:flex; align-items:center; gap:11px; padding:11px 14px}
  .team-row + .team-row{border-top:1px solid var(--line)}
  .tname{flex:1; font-family:var(--semi); font-weight:700; font-size:16.5px; color:var(--ink); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .team-row .seed{font-family:var(--cond); font-weight:700; font-size:12px; color:var(--steel-2); flex:none}
  .team-row:not(.win) .tname{color:var(--steel)}
  .score{font-family:var(--cond); font-weight:700; font-size:26px; letter-spacing:.02em; color:var(--ink); min-width:32px; text-align:right}
  .team-row:not(.win) .score{color:var(--steel-2)}
  .win-mark{width:14px; flex:none}
  .win-mark svg{width:14px;height:14px;stroke:var(--amber);fill:none;stroke-width:2.6}
  .game-foot{display:flex; gap:6px; padding:8px 12px; border-top:1px solid var(--line); background:color-mix(in srgb,var(--paper) 50%, var(--card)); flex-wrap:wrap}
  .watch{color:#8a5a00; border-color:var(--amber-soft); background:#fff7e9}
  .watch svg{fill:currentColor;stroke:none;width:13px;height:13px}
  @media (prefers-color-scheme: dark){ .watch{background:#241d10; color:var(--amber); border-color:#40361c} }

  /* ---------- Team cards ---------- */
  .teams-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px}
  .team-card{position:relative; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); cursor:pointer; overflow:hidden; padding:0; width:100%; font-family:var(--sans)}
  .team-card:hover{border-color:var(--steel-2)}
  .team-card:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
  .tc-bar{height:8px}
  .tc-body{padding:16px; display:flex; gap:13px; align-items:center}
  .tc-text{min-width:0}
  .tc-seed{font-family:var(--cond); font-weight:700; font-size:12px; color:var(--steel-2); letter-spacing:.08em}
  .tc-name{font-family:var(--cond); font-weight:700; font-size:22px; text-transform:uppercase; line-height:1.02; margin:2px 0 3px; color:var(--ink)}
  .tc-meta{font-family:var(--semi); font-weight:600; font-size:13px; color:var(--steel)}

  /* ---------- Updates ---------- */
  .feed{max-width:680px}
  .post{background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px}
  .post-time{font-family:var(--semi); font-weight:600; font-size:12.5px; color:var(--amber); text-transform:uppercase; letter-spacing:.06em}
  .post h3{font-size:22px; margin:4px 0 6px; color:var(--ink)}
  .post p{margin:0; color:var(--ink); white-space:pre-wrap; font-size:15.5px}
  .post .btn-ghost{margin-top:10px}

  /* ---------- Gallery ---------- */
  .gallery{columns:3 220px; column-gap:14px}
  .shot{break-inside:avoid; margin-bottom:14px; position:relative; border-radius:12px; overflow:hidden; border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow)}
  .shot img{width:100%; display:block; cursor:zoom-in}
  .shot .cap{padding:8px 12px; font-size:13.5px; color:var(--steel); font-family:var(--semi); font-weight:600}
  .shot .del{position:absolute; top:8px; right:8px}

  /* empty states */
  .empty{border:1.5px dashed var(--line); border-radius:14px; padding:44px 24px; text-align:center; color:var(--steel)}
  .empty h3{font-family:var(--cond); font-weight:700; text-transform:uppercase; font-size:22px; color:var(--ink); margin-bottom:6px}
  .empty p{margin:0 0 16px; max-width:44ch; margin-inline:auto; font-size:15px}

  /* ---------- Modal ---------- */
  .modal{position:fixed; inset:0; z-index:80; display:none; align-items:flex-start; justify-content:center; padding:40px 16px; background:rgba(10,12,16,.55); overflow-y:auto}
  .modal.open{display:flex}
  .sheet{background:var(--card); border:1px solid var(--line); border-radius:16px; width:100%; max-width:560px; box-shadow:0 24px 60px rgba(0,0,0,.35); overflow:hidden; animation:pop .2s ease}
  .sheet.wide{max-width:720px}
  @keyframes pop{from{opacity:0; transform:translateY(10px) scale(.99)} to{opacity:1; transform:none}}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line)}
  .sheet-head h3{font-size:24px; text-transform:uppercase; color:var(--ink)}
  .sheet-body{padding:20px; max-height:70vh; overflow-y:auto}
  .x{appearance:none; border:0; background:transparent; color:var(--steel); cursor:pointer; padding:6px; border-radius:8px; line-height:0}
  .x:hover{background:color-mix(in srgb,var(--ink) 8%, transparent); color:var(--ink)}
  .x svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}

  /* forms */
  label.f{display:block; margin-bottom:13px; font-family:var(--semi); font-weight:600; font-size:13px; color:var(--steel)}
  label.f span{display:block; margin-bottom:5px; text-transform:uppercase; letter-spacing:.04em}
  input.i, textarea.i, select.i{width:100%; font-family:var(--sans); font-size:15px; color:var(--ink); padding:10px 12px; border:1px solid var(--line); border-radius:9px; background:var(--paper)}
  input.i:focus, textarea.i:focus, select.i:focus{outline:2px solid var(--amber); outline-offset:0; border-color:var(--amber)}
  textarea.i{min-height:96px; resize:vertical}
  .frow{display:flex; gap:10px}
  .frow > *{flex:1}
  .sheet-foot{display:flex; justify-content:flex-end; gap:10px; padding:14px 20px; border-top:1px solid var(--line)}
  .hint{font-size:12.5px; color:var(--steel); margin-top:-6px; margin-bottom:12px; line-height:1.45}
  .hint a{color:var(--amber); font-weight:600}

  /* roster table */
  .roster{width:100%; border-collapse:collapse; font-size:15px}
  .roster th{font-family:var(--cond); font-weight:600; text-transform:uppercase; letter-spacing:.06em; font-size:13px; color:var(--steel); text-align:left; padding:8px 10px; border-bottom:2px solid var(--line)}
  .roster td{padding:9px 10px; border-bottom:1px solid var(--line)}
  .roster td.num{font-family:var(--cond); font-weight:700; font-size:18px; color:var(--amber); width:44px}
  .roster td.pn{font-family:var(--semi); font-weight:600}
  .roster tr:last-child td{border-bottom:0}
  .roster .rx{color:var(--steel-2)}
  .add-player{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; align-items:end}
  .add-player label.f{margin-bottom:0}
  .add-player .np{width:64px} .add-player .nn{flex:1; min-width:140px}
  .add-player .npos{width:80px} .add-player .ng{width:66px} .add-player .nh{width:78px}

  /* lightbox */
  .lightbox{position:fixed; inset:0; z-index:90; display:none; align-items:center; justify-content:center; padding:24px; background:rgba(6,8,11,.9)}
  .lightbox.open{display:flex}
  .lightbox img{max-width:100%; max-height:86vh; border-radius:8px}
  .lightbox .x{position:absolute; top:18px; right:20px; color:#fff}

  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--paper); font-family:var(--semi); font-weight:600; font-size:14px; padding:11px 18px; border-radius:999px; opacity:0; transition:.25s; z-index:100; pointer-events:none; max-width:90vw; text-align:center}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  footer{max-width:1080px; margin:0 auto; padding:0 20px 40px; color:var(--steel); font-size:13px}
  footer .fr{border-top:1px solid var(--line); padding-top:18px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}

  @media (max-width:560px){
    .gallery{columns:2 140px}
    .board h1{max-width:none}
  }
  body:not([data-edit="1"]) .edit-only{display:none !important}
</style>
</head>

  const root = n => $(`[data-root="${n}"]`);
  const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid = () => (crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2));

  let state;
  try{ state = JSON.parse($("#app-state").textContent); }
  catch(e){ state = {tournament:{},teams:[],games:[],updates:[],photos:[]}; }

  let CAP = { artifact:null, assets:null, user:null, canEdit:false };
  const teamById = id => state.teams.find(t=>t.id===id) || null;

  /* ---------------- persistence ---------------- */
  function buildDoc(){
    const clone = document.documentElement.cloneNode(true);
    clone.querySelectorAll('[data-root]').forEach(el=>el.innerHTML='');
    clone.querySelectorAll('.modal').forEach(m=>m.classList.remove('open'));
    const mb = clone.querySelector('#modal-body'); if(mb) mb.innerHTML='';
    clone.querySelector('#lightbox')?.classList.remove('open');
    clone.querySelector('#lightbox-img')?.removeAttribute('src');
    const b = clone.querySelector('body'); if(b) b.removeAttribute('data-edit');
    const s = clone.querySelector('#app-state'); if(s) s.textContent = JSON.stringify(state);
    return '<!DOCTYPE html>\n' + clone.outerHTML;
  }
  async function save(msg){
    render();
    if(!CAP.artifact){ if(msg) toast(msg+" — publish to keep it"); return; }
    try{ await CAP.artifact.publish(buildDoc()); if(msg) toast(msg); }
    catch(err){ toast(err && err.code==='conflict' ? "Someone else just saved — reloading" : "Couldn't save changes"); }
  }

  /* ---------------- badge ---------------- */
  function badge(t, size){
    const cls = "badge" + (size?(" "+size):"");
    if(!t) return `<span class="${cls}" style="background:var(--line);color:var(--steel-2)">·</span>`;
    const src = t.logoAsset ? ('/_blob/'+t.logoAsset) : (t.logoUrl||"");
    if(src) return `<span class="${cls} has-logo"><img src="${esc(src)}" alt="${esc(t.name)}"></span>`;
    return `<span class="${cls}" style="background:${esc(t.color||'#1C2C4C')}">${esc(t.abbr||t.name.slice(0,4).toUpperCase())}</span>`;
  }

  /* ---------------- render ---------------- */
  function render(){ renderHeader(); renderTicker(); renderSchedule(); renderTeams(); renderUpdates(); renderGallery(); }

  function renderHeader(){
    const t = state.tournament||{};
    const _elogo = t.logoAsset ? ('/_blob/'+t.logoAsset) : (t.logoUrl||""); root('emblem').innerHTML = _elogo ? `<div class="chip"><img src="${esc(_elogo)}" alt="${esc(t.name)}"></div>` : "";
    root('kicker').textContent = t.kicker||"";
    root('title').textContent = t.name||"Tournament";
    root('foot-name').textContent = t.name||"";
    root('memorial').innerHTML = t.memorial ? `<div class="memorial">${esc(t.memorial)}</div>` : "";
    const parts=[];
    if(t.dates) parts.push(`<span><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>${esc(t.dates)}</span>`);
    if(t.location) parts.push(`<span><svg viewBox="0 0 24 24"><path d="M12 21s-7-6-7-11a7 7 0 0114 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>${esc(t.location)}</span>`);
    if(CAP.canEdit) parts.push(`<span><button class="btn btn-sm btn-ghost" style="color:#C6CCD4" data-action="edit-info">Edit details</button></span>`);
    root('meta').innerHTML = parts.join('');
    root('teamstrip').innerHTML = state.teams.filter(t=>t.logoAsset||t.logoUrl).map(t=>{
      const src = t.logoAsset ? ('/_blob/'+t.logoAsset) : t.logoUrl;
      return `<button class="lchip" data-action="open-team" data-id="${t.id}" title="${esc(t.name)}"><img src="${esc(src)}" alt="${esc(t.name)}"></button>`;
    }).join('');
  }

  function gLabel(g){ return g.status==='final'?'Final':g.status==='live'?'Live':'Upcoming'; }
  function winner(g){ if(g.status!=='final') return null; return g.sa>g.sb?'a':g.sb>g.sa?'b':null; }

  function renderTicker(){
    const done = state.games.filter(g=>g.status==='final'||g.status==='live');
    const up = state.games.filter(g=>g.status==='up' && g.a && g.b);
    const items = [...done, ...up];
    const banner = (state.tournament&&state.tournament.banner)||'';
    const label = banner ? `<span class="tk tk-label">${esc(banner)}</span>` : '';
    if(!items.length){ root('ticker').innerHTML = label || `<span class="tk">Matchups appear here as the schedule is posted.</span>`; return; }
    const gameHtml = g=>{
      const a=teamById(g.a), b=teamById(g.b);
      const an=a?(a.abbr||a.name):'TBD', bn=b?(b.abbr||b.name):'TBD';
      if(g.status==='up') return `<span class="tk"><b>${esc(an)}</b> vs <b>${esc(bn)}</b> <span class="up">${esc(g.time||'')}</span></span>`;
      const w=winner(g);
      const as = w==='a'?`<b class="win">${g.sa}</b>`:`${g.sa}`, bs = w==='b'?`<b class="win">${g.sb}</b>`:`${g.sb}`;
      const tag = g.status==='live'?`<span class="live">LIVE</span>`:`<span style="color:var(--steel-2);font-family:var(--cond);font-weight:700">FINAL</span>`;
      return `<span class="tk">${tag} <b>${esc(an)}</b> <span class="sc">${as}–${bs}</span> <b>${esc(bn)}</b></span>`;
    };
    const chunks=[];
    items.forEach((g,i)=>{ if(i%4===0 && label) chunks.push(label); chunks.push(gameHtml(g)); });
    const one = chunks.join('');
    root('ticker').innerHTML = one + one;
  }

  function renderSchedule(){
    const el = root('schedule');
    if(!state.games.length){ el.innerHTML = emptyBox("No games scheduled yet","Add the first matchup and it shows up on the scoreboard and ticker instantly.", CAP.canEdit?'add-game':null,"Add game"); return; }
    const order = []; const byRound = {};
    state.games.forEach(g=>{ if(!byRound[g.round]){byRound[g.round]=[]; order.push(g.round);} byRound[g.round].push(g); });
    el.innerHTML = order.map(r=>`
      <div class="round-label">${esc(r)}</div>
      <div class="games">${byRound[r].map(gameCard).join('')}</div>`).join('');
  }

  function gameCard(g){
    const a=teamById(g.a), b=teamById(g.b), w=winner(g), hasScore=g.status!=='up';
    const side=(t,key)=>{
      const win = w===key;
      return `<div class="team-row ${win?'win':''}">
        ${badge(t,'sm')}
        ${t&&t.seed?`<span class="seed">#${t.seed}</span>`:''}
        <span class="tname">${t?esc(t.name):'To be determined'}</span>
        ${hasScore?`<span class="score">${key==='a'?g.sa:g.sb}</span>`:''}
        <span class="win-mark">${win?'<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>':''}</span>
      </div>`;
    };
    const meta = [g.court, g.time].filter(Boolean).join(' · ');
    const watch = g.video ? `<a class="btn btn-sm watch" href="${esc(g.video)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Watch game</a>` : '';
    return `<div class="game" data-game="${g.id}">
      <div class="game-top"><span>${esc(meta||'Time TBD')}</span><span class="status ${g.status}">${gLabel(g)}</span></div>
      ${side(a,'a')}${side(b,'b')}
      ${(watch)?`<div class="game-foot">${watch}</div>`:''}
      <div class="game-foot edit-only">
        <button class="btn btn-sm" data-action="score-game" data-id="${g.id}"><svg viewBox="0 0 24 24"><path d="M4 12h16"/></svg>Teams / score</button>
        <button class="btn btn-sm btn-ghost" data-action="del-game" data-id="${g.id}">Remove</button>
      </div>
    </div>`;
  }

  function renderTeams(){
    const el = root('teams');
    if(!state.teams.length){ el.innerHTML = emptyBox("No teams yet","Add each team with its colors, then build out the roster.", CAP.canEdit?'add-team':null,"Add team"); return; }
    el.innerHTML = state.teams.map(t=>{
      const n = t.roster?t.roster.length:0;
      const meta = n? `<b>${n}</b> ${n===1?'player':'players'}${t.record?' · '+esc(t.record):''}` : (t.record?esc(t.record):'Roster coming soon');
      return `<button class="team-card" data-action="open-team" data-id="${t.id}">
        <div class="tc-bar" style="background:${esc(t.color)}"></div>
        <div class="tc-body">
          ${badge(t,'lg')}
          <div class="tc-text">
            <div class="tc-seed">${t.seed?('SEED '+t.seed):(t.division?('DIVISION '+t.division):'&nbsp;')}</div>
            <div class="tc-name">${esc(t.name)}</div>
            <div class="tc-meta">${meta}</div>
          </div>
        </div>
      </button>`;
    }).join('');
  }

  function renderUpdates(){
    const el = root('updates');
    const ups = [...state.updates].sort((x,y)=>y.ts-x.ts);
    if(!ups.length){ el.innerHTML = emptyBox("No updates posted","Share scores, schedule changes, or info for families here.", CAP.canEdit?'add-update':null,"Post update"); return; }
    el.innerHTML = ups.map(u=>`
      <article class="post">
        <div class="post-time">${esc(u.posted || fmtTime(u.ts))}</div>
        <h3>${esc(u.title)}</h3>
        <p>${esc(u.body)}</p>
        <button class="btn btn-ghost btn-sm edit-only" data-action="del-update" data-id="${u.id}">Delete</button>
      </article>`).join('');
  }

  function renderGallery(){
    const el = root('gallery');
    if(!state.photos.length){ el.innerHTML = emptyBox("No photos yet","Add shots from the games — action, teams, the crowd.", CAP.canEdit?'add-photo':null,"Add photo"); return; }
    el.innerHTML = `<div class="gallery">${state.photos.map(p=>{
      const src = p.assetId ? ('/_blob/'+p.assetId) : (p.url||'');
      return `<figure class="shot">
        <img src="${esc(src)}" alt="${esc(p.caption||'Tournament photo')}" loading="lazy" data-action="zoom" data-src="${esc(src)}">
        ${p.caption?`<figcaption class="cap">${esc(p.caption)}</figcaption>`:''}
        <button class="btn btn-sm del edit-only" data-action="del-photo" data-id="${p.id}"><svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </figure>`;
    }).join('')}</div>`;
  }

  function emptyBox(h,p,action,cta){
    return `<div class="empty"><h3>${esc(h)}</h3><p>${esc(p)}</p>${action?`<button class="btn btn-primary" data-action="${action}">${esc(cta)}</button>`:''}</div>`;
  }
  function fmtTime(ts){ try{ return new Date(ts).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }catch(e){ return ''; } }

  /* ---------------- modal ---------------- */
  const modal=$("#modal"), sheet=$("#sheet"), mTitle=$("#modal-title"), mBody=$("#modal-body");
  function openModal(title, html, wide){ mTitle.textContent=title; mBody.innerHTML=html; sheet.classList.toggle('wide',!!wide); modal.classList.add('open'); const f=mBody.querySelector('input,textarea,select,button'); if(f) setTimeout(()=>f.focus(),40); }
  function closeModal(){ modal.classList.remove('open'); }
  function footBtns(saveLabel){ return `<div class="sheet-foot"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" data-save>${esc(saveLabel)}</button></div>`; }
  const val = id => { const e=$("#"+id); return e?e.value.trim():""; };
  function onSave(fn){ const b=mBody.querySelector('[data-save]'); if(b) b.addEventListener('click',fn); }

  /* ---------------- editors ---------------- */
  function editInfo(){
    const t=state.tournament||{};
    openModal("Tournament details", `
      <label class="f"><span>Name</span><input class="i" id="f-name" value="${esc(t.name||'')}"></label>
      <label class="f"><span>Subtitle</span><input class="i" id="f-kicker" value="${esc(t.kicker||'')}"></label>
      <label class="f"><span>Dedication</span><input class="i" id="f-mem" value="${esc(t.memorial||'')}"></label>
      <div class="frow">
        <label class="f"><span>Dates</span><input class="i" id="f-dates" value="${esc(t.dates||'')}"></label>
        <label class="f"><span>Venue</span><input class="i" id="f-loc" value="${esc(t.location||'')}" placeholder="Optional"></label>
      </div>` + footBtns("Save details"));
    onSave(()=>{ state.tournament={name:val('f-name'),kicker:val('f-kicker'),memorial:val('f-mem'),dates:val('f-dates'),location:val('f-loc')}; closeModal(); save("Details saved"); });
  }

  function teamForm(team){
    const t = team||{color:"#1C2C4C"};
    const hasLogo = !!(t.logoAsset||t.logoUrl);
    const upBlock = CAP.assets ? `
      <label class="f"><span>Team logo ${hasLogo?'(replace)':''}</span><input class="i" id="f-logofile" type="file" accept="image/*"></label>
      ${t.logoSource?`<div class="hint">Use the official logo: <a href="${esc(t.logoSource)}" target="_blank" rel="noopener">open it here</a>, save the image, then choose it above.</div>`:``}
      ${hasLogo?`<label class="f" style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="f-rmlogo" style="width:auto"> Remove current logo</label>`:``}`
      : `<div class="hint">Logo uploads aren't available in this view.</div>`;
    return `
      <label class="f"><span>Team name</span><input class="i" id="f-tname" value="${esc(t.name||'')}" placeholder="e.g. DRS Wildcats"></label>
      <div class="frow">
        <label class="f"><span>Badge text</span><input class="i" id="f-abbr" value="${esc(t.abbr||'')}" placeholder="DRS" maxlength="7"></label>
        <label class="f"><span>Color</span><input class="i" id="f-color" type="color" value="${esc(t.color||'#1C2C4C')}" style="padding:4px;height:42px"></label>
      </div>
      <div class="frow">
        <label class="f"><span>Division</span><input class="i" id="f-div" type="number" min="1" value="${t.division||''}"></label>
        <label class="f"><span>Seed</span><input class="i" id="f-seed" type="number" min="1" value="${t.seed||''}"></label>
      </div>
      <label class="f"><span>Record (optional)</span><input class="i" id="f-rec" value="${esc(t.record||'')}" placeholder="Preseason"></label>
      ${upBlock}`;
  }
  async function commitTeamLogo(t){
    const rm = $("#f-rmlogo"); if(rm && rm.checked){ delete t.logoAsset; delete t.logoUrl; }
    const fi = $("#f-logofile"); const file = fi && fi.files[0];
    if(file && CAP.assets){ try{ toast("Uploading logo…"); const res=await CAP.assets.upload(file); t.logoAsset=res.id; delete t.logoUrl; }catch(e){ toast("Logo upload failed — try a smaller image"); } }
  }
  function addTeam(){
    openModal("Add team", teamForm(null)+footBtns("Add team"));
    onSave(async ()=>{ const name=val('f-tname'); if(!name){toast("Give the team a name");return;}
      const t={id:uid(),name,abbr:val('f-abbr')||name.slice(0,4).toUpperCase(),seed:parseInt(val('f-seed'))||null,division:parseInt(val('f-div'))||null,record:val('f-rec'),color:val('f-color')||'#1C2C4C',roster:[]};
      await commitTeamLogo(t); state.teams.push(t); closeModal(); save("Team added"); });
  }
  function editTeam(id){
    const t=teamById(id); if(!t) return;
    openModal("Edit team", teamForm(t)+footBtns("Save"));
    onSave(async ()=>{ t.name=val('f-tname')||t.name; t.abbr=val('f-abbr')||t.abbr; t.seed=parseInt(val('f-seed'))||null; t.division=parseInt(val('f-div'))||null; t.record=val('f-rec'); t.color=val('f-color')||t.color; await commitTeamLogo(t); closeModal(); save("Team updated"); });
  }

  function openTeam(id){
    const t=teamById(id); if(!t) return;
    const rows = (t.roster||[]).map(p=>`
      <tr>
        <td class="num">${esc(p.num||'')}</td>
        <td class="pn">${esc(p.name||'')}</td>
        <td class="rx">${esc(p.pos||'')}</td>
        <td class="rx">${esc(p.grade||'')}</td>
        <td class="rx">${esc(p.ht||'')}</td>
        <td class="edit-only" style="text-align:right"><button class="btn btn-sm btn-ghost" data-delplayer="${p.id||''}">✕</button></td>
      </tr>`).join('') || `<tr><td colspan="6" class="rx" style="padding:18px 10px">No players added yet.</td></tr>`;
    openModal(t.name, `
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap">
        ${badge(t,'lg')}
        <div style="flex:1;min-width:140px">
          <div style="font-family:var(--semi);font-weight:600;color:var(--steel)">${[t.division?('Division '+t.division):null, t.seed?('Seed '+t.seed):'Seed TBD', t.record?esc(t.record):null].filter(Boolean).join(' · ')}</div>
        </div>
        <span class="edit-only" style="gap:6px">
          <button class="btn btn-sm" data-editteam="${t.id}">Edit team</button>
          <button class="btn btn-sm btn-ghost" data-delteam="${t.id}">Delete</button>
        </span>
      </div>
      <table class="roster"><thead><tr><th>#</th><th>Player</th><th>Pos</th><th>Yr</th><th>Ht</th><th class="edit-only"></th></tr></thead>
      <tbody>${rows}</tbody></table>
      <div class="add-player edit-only">
        <label class="f np"><span>#</span><input class="i" id="p-num" inputmode="numeric"></label>
        <label class="f nn"><span>Player name</span><input class="i" id="p-name"></label>
        <label class="f npos"><span>Pos</span><input class="i" id="p-pos" placeholder="PG"></label>
        <label class="f ng"><span>Yr</span><input class="i" id="p-grade" placeholder="Sr"></label>
        <label class="f nh"><span>Ht</span><input class="i" id="p-ht" placeholder="6'2&quot;"></label>
        <button class="btn btn-primary" id="p-add">Add</button>
      </div>`, true);
    if(CAP.canEdit) $$('.edit-only',mBody).forEach(e=>{ e.style.display='flex'; });
    const addBtn=$("#p-add");
    if(addBtn) addBtn.addEventListener('click',()=>{
      const name=val('p-name'); if(!name){toast("Enter a player name");return;}
      t.roster=t.roster||[]; t.roster.push({id:uid(),num:val('p-num'),name,pos:val('p-pos'),grade:val('p-grade'),ht:val('p-ht')});
      save(); openTeam(id);
    });
    mBody.addEventListener('click',e=>{
      const dp=e.target.closest('[data-delplayer]'); if(dp){ t.roster=(t.roster||[]).filter(p=>p.id!==dp.dataset.delplayer); save(); openTeam(id); return; }
      const et=e.target.closest('[data-editteam]'); if(et){ editTeam(et.dataset.editteam); return; }
      const dt=e.target.closest('[data-delteam]'); if(dt){ if(confirm("Delete this team? Its games will show TBD.")){ state.teams=state.teams.filter(x=>x.id!==dt.dataset.delteam); state.games.forEach(g=>{if(g.a===dt.dataset.delteam)g.a=null; if(g.b===dt.dataset.delteam)g.b=null;}); closeModal(); save("Team deleted"); } return; }
    });
  }

  function teamOptions(sel){ return `<option value="">TBD</option>` + state.teams.map(t=>`<option value="${t.id}"${sel===t.id?' selected':''}>${esc(t.name)}</option>`).join(''); }

  function addGame(){
    openModal("Add game", `
      <label class="f"><span>Round / group</span><input class="i" id="g-round" value="Pool Play · Sun, Oct 11" placeholder="e.g. Semifinals"></label>
      <div class="frow">
        <label class="f"><span>Team 1</span><select class="i" id="g-a">${teamOptions()}</select></label>
        <label class="f"><span>Team 2</span><select class="i" id="g-b">${teamOptions()}</select></label>
      </div>
      <div class="frow">
        <label class="f"><span>Tip-off</span><input class="i" id="g-time" placeholder="Sun 6:00 PM"></label>
        <label class="f"><span>Court / gym</span><input class="i" id="g-court" placeholder="Main Gym"></label>
      </div>
      <label class="f"><span>Video link (optional)</span><input class="i" id="g-video" placeholder="https://youtube.com/..."></label>` + footBtns("Add game"));
    onSave(()=>{ state.games.push({id:uid(),round:val('g-round')||'Games',a:val('g-a')||null,b:val('g-b')||null,sa:0,sb:0,status:'up',time:val('g-time'),court:val('g-court'),video:val('g-video')}); closeModal(); save("Game added"); });
  }

  function scoreGame(id){
    const g=state.games.find(x=>x.id===id); if(!g) return;
    openModal("Update game", `
      <div class="frow">
        <label class="f"><span>Team 1</span><select class="i" id="s-ta">${teamOptions(g.a)}</select></label>
        <label class="f"><span>Team 2</span><select class="i" id="s-tb">${teamOptions(g.b)}</select></label>
      </div>
      <div class="frow">
        <label class="f"><span>Score 1</span><input class="i" id="s-a" type="number" min="0" value="${g.sa||0}"></label>
        <label class="f"><span>Score 2</span><input class="i" id="s-b" type="number" min="0" value="${g.sb||0}"></label>
      </div>
      <label class="f"><span>Status</span><select class="i" id="s-status">
        <option value="up"${g.status==='up'?' selected':''}>Upcoming</option>
        <option value="live"${g.status==='live'?' selected':''}>Live now</option>
        <option value="final"${g.status==='final'?' selected':''}>Final</option>
      </select></label>
      <div class="frow">
        <label class="f"><span>Tip-off</span><input class="i" id="s-time" value="${esc(g.time||'')}"></label>
        <label class="f"><span>Court / gym</span><input class="i" id="s-court" value="${esc(g.court||'')}"></label>
      </div>
      <label class="f"><span>Video link</span><input class="i" id="s-video" value="${esc(g.video||'')}" placeholder="https://youtube.com/..."></label>` + footBtns("Save"));
    onSave(()=>{ g.a=val('s-ta')||null; g.b=val('s-tb')||null; g.sa=parseInt(val('s-a'))||0; g.sb=parseInt(val('s-b'))||0; g.status=val('s-status'); g.time=val('s-time'); g.court=val('s-court'); g.video=val('s-video'); closeModal(); save("Game updated"); });
  }

  function addUpdate(){
    openModal("Post an update", `
      <label class="f"><span>Headline</span><input class="i" id="u-title" placeholder="Semifinals are set"></label>
      <label class="f"><span>Message</span><textarea class="i" id="u-body" placeholder="What happened, what's next, info for families…"></textarea></label>`
      + footBtns("Post update"));
    onSave(()=>{ const title=val('u-title'); if(!title){toast("Add a headline");return;} state.updates.push({id:uid(),ts:Date.now(),title,body:val('u-body')}); closeModal(); save("Update posted"); });
  }

  function addPhoto(){
    const canUpload = !!CAP.assets;
    openModal("Add a photo", `
      ${canUpload?`<label class="f"><span>Upload from your device</span><input class="i" id="ph-file" type="file" accept="image/*"></label>
      <div class="hint">Stored with this site.</div>
      <div style="text-align:center;color:var(--steel);font-family:var(--semi);margin:6px 0 14px">— or —</div>`:''}
      <label class="f"><span>Paste an image link</span><input class="i" id="ph-url" placeholder="https://…/photo.jpg"></label>
      <label class="f"><span>Caption (optional)</span><input class="i" id="ph-cap"></label>`
      + footBtns("Add photo"));
    onSave(async ()=>{
      const cap=val('ph-cap'), url=val('ph-url');
      const file = canUpload ? $("#ph-file").files[0] : null;
      if(file){ try{ toast("Uploading…"); const res=await CAP.assets.upload(file); state.photos.push({id:uid(),assetId:res.id,caption:cap}); closeModal(); save("Photo added"); }catch(e){ toast("Upload failed — try a smaller image or paste a link"); } return; }
      if(url){ state.photos.push({id:uid(),url,caption:cap}); closeModal(); save("Photo added"); return; }
      toast("Choose a file or paste a link");
    });
  }

  /* ---------------- events ---------------- */
  document.addEventListener('click',e=>{
    const tab=e.target.closest('.tab'); if(tab){ selectTab(tab.dataset.tab); return; }
    if(e.target.closest('[data-close]')){ closeModal(); $("#lightbox").classList.remove('open'); return; }
    if(e.target===modal){ closeModal(); return; }
    const a=e.target.closest('[data-action]'); if(!a) return;
    const act=a.dataset.action, id=a.dataset.id;
    const guarded = ['edit-info','add-team','add-game','score-game','del-game','add-update','del-update','add-photo','del-photo'];
    if(!CAP.canEdit && guarded.includes(act)){ toast("You have view-only access"); return; }
    switch(act){
      case 'edit-info': editInfo(); break;
      case 'add-team': addTeam(); break;
      case 'open-team': openTeam(id); break;
      case 'add-game': addGame(); break;
      case 'score-game': scoreGame(id); break;
      case 'del-game': if(confirm("Remove this game?")){ state.games=state.games.filter(g=>g.id!==id); save("Game removed"); } break;
      case 'add-update': addUpdate(); break;
      case 'del-update': if(confirm("Delete this update?")){ state.updates=state.updates.filter(u=>u.id!==id); save("Update deleted"); } break;
      case 'add-photo': addPhoto(); break;
      case 'del-photo': if(confirm("Remove this photo?")){ state.photos=state.photos.filter(p=>p.id!==id); save("Photo removed"); } break;
      case 'zoom': { const img=$("#lightbox-img"); img.src=a.dataset.src; $("#lightbox").classList.add('open'); } break;
    }
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeModal(); $("#lightbox").classList.remove('open'); } });

  function selectTab(name){
    $$('.tab').forEach(t=>t.setAttribute('aria-selected', t.dataset.tab===name));
    $$('.panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+name));
    window.scrollTo({top:0,behavior:'smooth'});
  }

  let toastTimer;
  function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }

  async function initCaps(){
    if(!window.claude || !claude.use) return;
    try{ CAP.user = await claude.use("user"); }catch(e){}
    try{ CAP.artifact = await claude.use("artifact"); }catch(e){}
    try{ CAP.assets = await claude.use("assets"); }catch(e){}
    CAP.canEdit = CAP.user ? (CAP.user.canEdit ? !!CAP.user.canEdit() : true) : !!CAP.artifact;
    document.body.dataset.edit = CAP.canEdit ? "1" : "0";
    render();
  }


  /* ---------------- live data from the Google Sheet ----------------
     The page renders the embedded snapshot first, then reads the published
     sheet and re-renders whenever the data changes. Logos stay embedded in
     this file and are matched to sheet rows by team name, then badge text. */
  const SHEET = {
    base: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQWmZv2oqYBSVluXtMZvs-4vHyo3-uQt9XHtqV4zeRBAdSCjpqB_A0wfs_VFUFyCIfxIso1i8dew2OA/pub",
    tabs: { tournament: 590456181, teams: 1451415506, games: 1254668490, updates: 1077246062, roster: 415936302, photos: 533809854 },
    refreshMs: 60000
  };
  const LOGOS = {};
  (state.teams || []).forEach(t => {
    if(!t.logoUrl) return;
    if(t.name) LOGOS["n:" + t.name.trim().toLowerCase()] = t.logoUrl;
    if(t.abbr) LOGOS["a:" + t.abbr.trim().toLowerCase()] = t.logoUrl;
  });
  const EMBLEM = (state.tournament || {}).logoUrl || "";
  const STATUS = { upcoming: "up", live: "live", final: "final" };
  const cell = v => (v == null ? "" : String(v).trim());
  const slug = s => cell(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || uid();

  function fetchTab(name){
    const url = `${SHEET.base}?gid=${SHEET.tabs[name]}&single=true&output=csv&_=${Date.now()}`;
    return fetch(url, { cache: "no-store" }).then(r => {
      if(!r.ok) throw new Error(name + " HTTP " + r.status);
      return r.text();
    }).then(txt => {
      const out = Papa.parse(txt, { header: true, skipEmptyLines: "greedy" });
      if(!out.meta.fields || !out.meta.fields.length) throw new Error(name + ": no header row");
      return out.data;
    });
  }

  function buildState(d){
    const need = (rows, cols, tab) => {
      const have = rows.length ? Object.keys(rows[0]) : [];
      cols.forEach(c => { if(rows.length && !have.includes(c)) throw new Error(tab + ": missing column " + c); });
    };
    need(d.teams, ["Team"], "Teams"); need(d.games, ["Round", "Team 1", "Team 2", "Status"], "Games");

    const set = {};
    d.tournament.forEach(r => { set[cell(r.Setting).toLowerCase()] = cell(r.Value); });
    const tournament = { name: set["name"], kicker: set["subtitle"], memorial: set["dedication"],
      dates: set["dates"], location: set["venue"], banner: set["ticker banner"], logoUrl: EMBLEM };

    const byName = {};
    const teams = d.teams.filter(r => cell(r.Team)).map(r => {
      const name = cell(r.Team), abbr = cell(r["Badge text"]);
      const t = { id: slug(name), name, abbr: abbr || name.slice(0, 4).toUpperCase(),
        color: cell(r.Color) || "#1C2C4C", division: parseInt(r.Division) || null,
        seed: parseInt(r.Seed) || null, record: cell(r.Record), roster: [] };
      const logo = LOGOS["n:" + name.toLowerCase()] || (abbr && LOGOS["a:" + abbr.toLowerCase()]);
      if(logo) t.logoUrl = logo;
      byName[name.toLowerCase()] = t;
      return t;
    });
    const teamId = v => {
      const n = cell(v).toLowerCase();
      if(!n) return null;
      if(byName[n]) return byName[n].id;
      console.warn("Sheet: unknown team name", v);
      return null;
    };

    (d.roster || []).forEach(r => {
      const t = byName[cell(r.Team).toLowerCase()];
      if(!t){ if(cell(r.Player)) console.warn("Sheet: roster row for unknown team", r.Team); return; }
      if(!cell(r.Player)) return;
      t.roster.push({ id: uid(), num: cell(r.Number), name: cell(r.Player), pos: cell(r.Position), grade: cell(r.Year), ht: cell(r.Height) });
    });

    const games = d.games.filter(r => cell(r.Round) || cell(r["Team 1"]) || cell(r["Team 2"])).map((r, i) => {
      const st = STATUS[cell(r.Status).toLowerCase()];
      if(!st && cell(r.Status)) console.warn("Sheet: unknown status", r.Status);
      return { id: "g" + i, round: cell(r.Round) || "Games", a: teamId(r["Team 1"]), b: teamId(r["Team 2"]),
        sa: parseInt(r["Score 1"]) || 0, sb: parseInt(r["Score 2"]) || 0, status: st || "up",
        time: cell(r["Tip-off"]), court: cell(r.Court), video: cell(r["Video link"]) };
    });

    const updates = (d.updates || []).filter(r => cell(r.Headline)).map((r, i) => (
      { id: "u" + i, ts: i, posted: cell(r.Posted), title: cell(r.Headline), body: cell(r.Message) }));

    const photos = (d.photos || []).filter(r => cell(r["Image link"])).map((r, i) => (
      { id: "p" + i, url: cell(r["Image link"]), caption: cell(r.Caption) }));

    return { tournament, teams, games, updates, photos };
  }

  let lastSheet = "";
  const syncEl = () => root('sync');
  const SYNC_OK = syncEl() ? syncEl().textContent : "";
  async function loadSheet(){
    if(!window.Papa){ syncEl().textContent = "Showing saved results. Live updates will resume shortly."; return; }
    try{
      const names = Object.keys(SHEET.tabs);
      const rows = await Promise.all(names.map(fetchTab));
      const d = {}; names.forEach((n, i) => d[n] = rows[i]);
      const next = buildState(d);
      const key = JSON.stringify(next);
      syncEl().textContent = SYNC_OK;
      if(key === lastSheet) return;
      lastSheet = key;
      state = next;
      render();
    }catch(err){
      console.warn("Sheet load failed; keeping current results.", err);
      syncEl().textContent = "Showing saved results. Live updates will resume shortly.";
    }
  }

  render();
  loadSheet();
  setInterval(loadSheet, SHEET.refreshMs);
})();
</script>
</body>
</html>
